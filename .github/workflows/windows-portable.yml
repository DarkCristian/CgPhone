name: Windows Free installer

on:
  workflow_dispatch:
  push:
    branches:
      - release/free-0.3.2
      - fix/minimize-taskbar
      - fix/windows-installer-dependencies
      - fix/uninstaller-remove-settings
      - security/windows-defender-scan
      - security/pjproject-cve-fixes-beta-38
      - security/qt-advisories-2026-09
      - security/openssl-2026-09-rc3
    paths:
      - .github/workflows/windows-portable.yml
      - installer/CgPhone.iss
      - scripts/build-windows-portable-msys2.sh
      - scripts/generate-compliance-manifest.sh
      - CMakeLists.txt
      - src/**
      - qml/**
      - tests/**
      - docs/QT_SECURITY_2026-09.md

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make autoconf automake libtool zip
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-qt6-svg

      - name: Verificar rutas de advisories Qt
        shell: bash
        run: python3 tests/check_qt_advisory_entrypoints.py

      - name: Compilar CgPhone y PJPROJECT
        shell: msys2 {0}
        run: bash scripts/build-windows-portable-msys2.sh

      - name: Instalar Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Crear instalador EXE
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "No se encontró Inno Setup en $iscc"
          }
          & $iscc "/O$PWD" "installer\\CgPhone.iss"
          if (-not (Test-Path "CgPhone-Setup-0.3.2-x64.exe")) {
            throw "No se generó el instalador esperado"
          }

      - name: Validar contenido del instalador
        shell: powershell
        run: |
          $setup = Join-Path $PWD "CgPhone-Setup-0.3.2-x64.exe"
          $testDir = Join-Path $env:RUNNER_TEMP "CgPhone-installed-test"
          if (Test-Path $testDir) {
            Remove-Item $testDir -Recurse -Force
          }
          $process = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$testDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "El instalador terminó con código $($process.ExitCode)"
          }

          $portableRoot = Join-Path $PWD "CgPhone-portable"
          $missing = @()
          $different = @()
          Get-ChildItem $portableRoot -File -Recurse | ForEach-Object {
            $relative = $_.FullName.Substring($portableRoot.Length).TrimStart('\\')
            $installed = Join-Path $testDir $relative
            if (-not (Test-Path $installed)) {
              $missing += $relative
            } elseif ((Get-FileHash $_.FullName -Algorithm SHA256).Hash -ne (Get-FileHash $installed -Algorithm SHA256).Hash) {
              $different += $relative
            }
          }
          if ($missing.Count -gt 0) {
            throw "El instalador omitió archivos del portable: $($missing -join ', ')"
          }
          if ($different.Count -gt 0) {
            throw "El instalador alteró archivos del portable: $($different -join ', ')"
          }

          $required = @(
            "bin\\libgcc_s_seh-1.dll",
            "bin\\libcrypto-3-x64.dll",
            "bin\\libopencore-amrnb-0.dll",
            "bin\\libopus-0.dll",
            "bin\\libssl-3-x64.dll"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $testDir $relative))) {
              throw "Falta dependencia obligatoria después de instalar: $relative"
            }
          }

      - name: Analizar distribución con Microsoft Defender
        id: defender_scan
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $report = "Microsoft-Defender-scan-report.txt"
          $result = "ERROR"
          $engineVersion = "unavailable"
          $platformVersion = "unavailable"
          $signatureVersion = "unavailable"
          $signatureUpdated = "unavailable"
          $detectionCount = 0
          $failureReason = "Defender scan did not complete"

          try {
            foreach ($command in @("Get-MpComputerStatus", "Update-MpSignature", "Start-MpScan", "Get-MpThreatDetection")) {
              if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
                throw "Microsoft Defender cmdlet unavailable: $command"
              }
            }

            Update-MpSignature
            $status = Get-MpComputerStatus
            $engineVersion = [string]$status.AMEngineVersion
            $platformVersion = [string]$status.AMProductVersion
            $signatureVersion = [string]$status.AntivirusSignatureVersion
            $signatureUpdated = ([DateTime]$status.AntivirusSignatureLastUpdated).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

            if (-not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
              throw "Microsoft Defender Antivirus is not active on the runner"
            }

            $scanStarted = Get-Date
            $targets = @(
              (Join-Path $PWD "CgPhone-Setup-0.3.2-x64.exe"),
              (Join-Path $PWD "CgPhone-portable"),
              (Join-Path $PWD "CgPhone-0.3.2-windows-x64-portable.zip"),
              (Join-Path $env:RUNNER_TEMP "CgPhone-installed-test")
            )
            foreach ($target in $targets) {
              if (-not (Test-Path $target)) {
                throw "Expected scan target is missing"
              }
              Start-MpScan -ScanType CustomScan -ScanPath $target
            }

            Start-Sleep -Seconds 5
            $newDetections = @(
              Get-MpThreatDetection -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.InitialDetectionTime -and
                  ([DateTime]$_.InitialDetectionTime) -ge $scanStarted.AddSeconds(-5)
                }
            )
            $detectionCount = $newDetections.Count

            $targetsIntact = (Test-Path "CgPhone-Setup-0.3.2-x64.exe") -and
              (Test-Path "CgPhone-0.3.2-windows-x64-portable.zip") -and
              (Test-Path "CgPhone-portable\bin\CgPhone.exe")
            if (-not $targetsIntact) {
              throw "One or more artifacts were removed or quarantined during the scan"
            }
            if ($detectionCount -gt 0) {
              $result = "DETECTED"
              $failureReason = "Microsoft Defender reported one or more detections"
            } else {
              $result = "CLEAN"
              $failureReason = "none"
            }
          } catch {
            if ($result -ne "DETECTED") {
              $result = "ERROR"
              if ($_.Exception.Message -match "not active") {
                $failureReason = "Microsoft Defender Antivirus was not active"
              } elseif ($_.Exception.Message -match "cmdlet unavailable") {
                $failureReason = "Required Microsoft Defender command was unavailable"
              } elseif ($_.Exception.Message -match "missing") {
                $failureReason = "An expected scan target was missing"
              } elseif ($_.Exception.Message -match "removed or quarantined") {
                $failureReason = "An artifact was removed or quarantined"
              } else {
                $failureReason = "Microsoft Defender scan failed; inspect the private workflow log"
              }
            }
          }

          @(
            "Product=CgPhone Free 0.3.2"
            "Commit=$env:GITHUB_SHA"
            "WorkflowRun=$env:GITHUB_RUN_ID"
            "ScannedAtUtc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "EngineVersion=$engineVersion"
            "PlatformVersion=$platformVersion"
            "SecurityIntelligenceVersion=$signatureVersion"
            "SecurityIntelligenceUpdatedUtc=$signatureUpdated"
            "Targets=installer;portable-runtime;portable-archive;installed-runtime"
            "DetectionCount=$detectionCount"
            "Result=$result"
            "FailureReason=$failureReason"
            "Privacy=No endpoint hostname, username, local path, SIP log or company data included"
          ) | Set-Content $report -Encoding ascii

          "DEFENDER_SCAN_RESULT=$result" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Microsoft Defender result: $result"

      - name: Publicar evidencia de Microsoft Defender
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CgPhone-Free-0.3.2-security-rc3-build.${{ github.run_number }}-Microsoft-Defender-report
          path: Microsoft-Defender-scan-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Aplicar gate de Microsoft Defender
        shell: powershell
        run: |
          if ($env:DEFENDER_SCAN_RESULT -ne "CLEAN") {
            throw "Microsoft Defender gate failed with result: $env:DEFENDER_SCAN_RESULT"
          }

      - name: Generar SHA-256 y aviso de distribución
        shell: powershell
        run: |
          $file = "CgPhone-Setup-0.3.2-x64.exe"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $file" | Set-Content "CgPhone-Setup-0.3.2-x64.exe.sha256" -Encoding ascii
          @"
          CgPhone Free 0.3.2 - Windows x64

          AVISO DE SMARTSCREEN
          Este instalador todavía no posee una firma digital pública con reputación
          Microsoft SmartScreen. Windows puede mostrar el aviso "Windows protegió su PC".
          Descargue CgPhone únicamente desde el repositorio oficial y verifique el SHA-256.

          LINUX
          La versión Linux experimental RC1 se conserva sin recompilar.
          Actualice Debian 13 y consulte el informe de runtime de la Release.

          Proyecto gratuito y de código abierto.
          "@ | Set-Content "LEEME-ANTES-DE-INSTALAR.txt" -Encoding utf8

      - name: Publicar evidencia SBOM independiente
        shell: powershell
        run: |
          $source = "CgPhone-portable\COMPLIANCE\CgPhone-sbom.spdx.json"
          if (-not (Test-Path $source)) {
            throw "No se generó el SBOM SPDX esperado: $source"
          }
          Copy-Item $source "CgPhone-0.3.2-sbom.spdx.json"
          $sbomHash = (Get-FileHash "CgPhone-0.3.2-sbom.spdx.json" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sbomHash  CgPhone-0.3.2-sbom.spdx.json" | Set-Content "CgPhone-0.3.2-sbom.spdx.json.sha256" -Encoding ascii

          $sbom = Get-Content "CgPhone-0.3.2-sbom.spdx.json" -Raw | ConvertFrom-Json
          if ($sbom.spdxVersion -ne "SPDX-2.3" -or $sbom.SPDXID -ne "SPDXRef-DOCUMENT") {
            throw "El documento generado no cumple la cabecera SPDX 2.3 esperada"
          }

      - name: Generar manifiesto SHA-256 de la distribución
        shell: powershell
        run: |
          $files = @(
            "CgPhone-Setup-0.3.2-x64.exe",
            "CgPhone-0.3.2-windows-x64-portable.zip",
            "CgPhone-0.3.2-sbom.spdx.json",
            "Microsoft-Defender-scan-report.txt"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "No existe el artefacto esperado: $file"
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $lines | Set-Content "SHA256SUMS.txt" -Encoding ascii

      - name: Generar atestación de procedencia
        uses: actions/attest@v4
        with:
          subject-path: |
            CgPhone-Setup-0.3.2-x64.exe
            CgPhone-0.3.2-windows-x64-portable.zip
            CgPhone-0.3.2-sbom.spdx.json
            Microsoft-Defender-scan-report.txt
            SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CgPhone-Free-0.3.2-security-rc3-build.${{ github.run_number }}-Windows-x64
          path: |
            CgPhone-Setup-0.3.2-x64.exe
            CgPhone-Setup-0.3.2-x64.exe.sha256
            CgPhone-0.3.2-sbom.spdx.json
            CgPhone-0.3.2-sbom.spdx.json.sha256
            Microsoft-Defender-scan-report.txt
            SHA256SUMS.txt
            LEEME-ANTES-DE-INSTALAR.txt
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: CgPhone-Free-0.3.2-security-rc3-build.${{ github.run_number }}-Windows-x64-portable
          path: CgPhone-0.3.2-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

  publish_rc3:
    if: github.ref == 'refs/heads/security/openssl-2026-09-rc3'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CgPhone-Free-0.3.2-security-rc3-build.${{ github.run_number }}-Windows-x64
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: CgPhone-Free-0.3.2-security-rc3-build.${{ github.run_number }}-Windows-x64-portable
          path: dist
      - name: Verify Windows and preserve Linux RC1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          mv dist/SHA256SUMS.txt dist/WINDOWS-SHA256SUMS.txt
          mkdir linux
          gh release download v0.3.2-rc.1 -D linux -p '*linux*' -p 'Linux-*' -p 'LINUX-*'
          (cd linux && sha256sum -c LINUX-SHA256SUMS.txt)
          echo 'cf75890d85d160376a5cbc1137056b070454526dd05083dcfc33a1850dcf880c  linux/cgphone_0.3.2-rc.1_linux-experimental_amd64.deb' | sha256sum -c -
          echo 'e6aa46ba4ff7654d3da65ac9f375d35447f8b6d4ede7e8ac704e2c30c4fa21cd  linux/CgPhone-0.3.2-rc.1-linux-experimental-amd64.tar.xz' | sha256sum -c -
          cp linux/* dist/
      - name: Validate unchanged Linux with patched system OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          docker run --rm -v "$PWD/dist:/in:ro" -v "$PWD/evidence:/out" debian:trixie bash -euc '
            apt-get update
            apt-get install -y xz-utils openssl /in/cgphone_0.3.2-rc.1_linux-experimental_amd64.deb
            version=$(dpkg-query -W -f="\${Version}" libssl3t64)
            dpkg --compare-versions "$version" ge "3.5.7-1~deb13u3"
            dpkg-query -W > /out/Linux-RC3-runtime-packages.tsv
            openssl version > /out/Linux-RC3-openssl.txt
            useradd -m tester
            set +e
            runuser -u tester -- env QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 12 /usr/bin/CgPhone > /tmp/startup.log 2>&1
            result=$?
            set -e
            test "$result" = 124
            ! grep -Ei "failed to load component|is not installed|error while loading shared libraries|Segmentation fault" /tmp/startup.log
            mkdir /tmp/archive
            tar -xJf /in/CgPhone-0.3.2-rc.1-linux-experimental-amd64.tar.xz -C /tmp/archive
            cmp /usr/bin/CgPhone /tmp/archive/usr/bin/CgPhone
          '
          printf '%s\n' 'Debian13-amd64=PASS' 'Packages=unchanged-RC1' 'Patched-system-OpenSSL=PASS' 'Offscreen-startup=PASS' 'Tar-executable-parity=PASS' 'SIP-and-hardware-audio=NOT_TESTED' 'Historical-SBOM=RC1-build-only' > evidence/Linux-RC3-runtime-report.txt
          cp evidence/* dist/
          cp docs/OPENSSL_SECURITY_2026-09.md dist/
          (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt)
      - name: Attest current validation evidence and combined manifest
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/Linux-RC3-*
            dist/SHA256SUMS.txt
      - name: Publish complete RC3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for f in CgPhone-Setup-0.3.2-x64.exe CgPhone-0.3.2-windows-x64-portable.zip cgphone_0.3.2-rc.1_linux-experimental_amd64.deb CgPhone-0.3.2-rc.1-linux-experimental-amd64.tar.xz; do test -s "dist/$f"; done
          cp docs/OPENSSL_SECURITY_2026-09.md notes.md
          printf '\nBuild commit: %s\nWorkflow: https://github.com/%s/actions/runs/%s\n\n## SHA-256\n\n\x60\x60\x60text\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> notes.md
          cat dist/SHA256SUMS.txt >> notes.md
          printf '\n\x60\x60\x60\n' >> notes.md
          gh release create v0.3.2-rc.3 --draft --target "$GITHUB_SHA" --title 'CgPhone 0.3.2 RC3 — OpenSSL security update' --prerelease --notes-file notes.md
          gh release upload v0.3.2-rc.3 dist/*
          gh release edit v0.3.2-rc.3 --draft=false
