name: Update beta.37 release notes

on:
  push:
    branches:
      - docs/beta37-functional-validation
    paths:
      - .github/workflows/update-beta37-release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release notes
        shell: bash
        run: |
          set -euo pipefail
          gh release edit v0.3.1-beta.37 \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file docs/releases/v0.3.1-beta.37.md
